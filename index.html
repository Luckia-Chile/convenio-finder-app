<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  
  <!-- Mobile Optimization Meta Tags CRÍTICAS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2563eb" />
  <meta name="msapplication-TileColor" content="#2563eb" />
  <meta name="apple-mobile-web-app-title" content="Sistema Convenios" />
  <meta name="application-name" content="Sistema Convenios" />
  
  <!-- SEO Optimizado -->
  <meta name="description" content="Sistema de gestión para consulta de convenios y beneficiarios. Plataforma responsive optimizada para búsqueda rápida y carga de archivos Excel." />
  <meta name="keywords" content="convenios, beneficiarios, consulta, gestión, excel, búsqueda, responsive, móvil" />
  <meta name="author" content="Sistema de Convenios" />
  
  <!-- Anti-translation para proteger datos -->
  <meta name="google" content="notranslate">
  
  <!-- Favicons optimizados -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- Critical CSS inlined para performance -->
  <style>
    /* Reset y base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f9fafb 0%, #e5f3ff 100%);
      color: #111827;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
    }
    
    /* Prevent layout shift */
    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Loading skeleton con animación de lujo */
    .loading-skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    /* Animación para progress bars */
    @keyframes progress-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .animate-shimmer {
      animation: progress-shimmer 1.5s infinite;
    }
    
    /* Touch-friendly scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.8);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #cbd5e1, #94a3b8);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #94a3b8, #64748b);
    }
    
    /* Mobile específico */
    @media (max-width: 768px) {
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      
      /* Optimizaciones táctiles */
      * {
        -webkit-tap-highlight-color: rgba(37, 99, 235, 0.1);
        -webkit-touch-callout: none;
      }
      
      /* Prevenir zoom en inputs (iOS Safari) */
      input, select, textarea {
        font-size: 16px !important;
      }
    }
    
    /* Reduce motion para accesibilidad */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      
      .loading-skeleton {
        animation: none;
        background: #f3f4f6;
      }
    }
    
    /* Dark mode detection */
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
        color: #f9fafb;
      }
    }
    
    /* Luxury loading screen */
    .initial-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f9fafb 0%, #e5f3ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(10px);
    }
    
    .initial-loading .spinner-container {
      text-align: center;
      animation: fadeInUp 0.6s ease-out;
    }
    
    .initial-loading .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2563eb, #3b82f6, #60a5fa);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      box-shadow: 
        0 25px 50px -12px rgba(37, 99, 235, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      /*overflow: hidden;*/
    }
    
    .initial-loading .logo::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      animation: logoShine 2s infinite;
    }
    
    .initial-loading .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid transparent;
      border-top: 6px solid #2563eb;
      border-right: 6px solid #3b82f6;
      border-radius: 50%;
      animation: luxurySpin 1s linear infinite;
      margin: 0 auto 24px;
      position: relative;
    }
    
    .initial-loading .spinner::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border: 6px solid transparent;
      border-left: 6px solid #60a5fa;
      border-radius: 50%;
      animation: luxurySpin 1.5s linear infinite reverse;
    }
    
    .initial-loading .title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #1f2937, #2563eb, #3b82f6);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.025em;
    }
    
    .initial-loading .subtitle {
      font-size: 16px;
      color: #6b7280;
      opacity: 0.9;
      font-weight: 500;
    }
    
    @keyframes luxurySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes fadeInUp {
      0% { 
        opacity: 0; 
        transform: translateY(30px); 
      }
      100% { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes logoShine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }
    
    /* Safe area para dispositivos con notch */
    body {
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    /* Optimizaciones de texto */
    .notranslate {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
    
    /* Mejoras de performance */
    img, video {
      max-width: 100%;
      height: auto;
    }
    
    /* Utility classes críticas */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      /*overflow: hidden;*/
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  
  <title>Sistema de Convenios - Gestión Inteligente</title>
</head>
<body>
  <!-- Luxury loading screen -->
  <div id="initial-loading" class="initial-loading">
    <div class="spinner-container">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5L12 9L21 5L12 1Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 17L12 21L21 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 12L12 16L21 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="spinner"></div>
      <div class="title">Sistema de Convenios</div>
      <div class="subtitle">Cargando experiencia optimizada...</div>
    </div>
  </div>
  
  <!-- Main app container -->
  <div id="root"></div>
  
  <!-- Main React app -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
